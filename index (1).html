<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudTasks - Gestor de Tareas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>☁️ CloudTasks</h1>
                <p class="subtitle">Tu gestor de tareas en la nube</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Formulario para crear tarea -->
            <section class="form-section">
                <h2>Crear Nueva Tarea</h2>
                <form id="taskForm" class="task-form">
                    <div class="form-group">
                        <label for="title">Título de la tarea *</label>
                        <input 
                            type="text" 
                            id="title" 
                            name="title" 
                            placeholder="Ej: Completar informe" 
                            required
                        >
                        <span class="error" id="titleError"></span>
                    </div>

                    <div class="form-group">
                        <label for="description">Descripción</label>
                        <textarea 
                            id="description" 
                            name="description" 
                            placeholder="Detalles adicionales..." 
                            rows="3"
                        ></textarea>
                        <span class="error" id="descriptionError"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="deadline">Fecha Límite</label>
                            <input 
                                type="date" 
                                id="deadline" 
                                name="deadline"
                            >
                            <span class="error" id="deadlineError"></span>
                        </div>

                        <div class="form-group">
                            <label for="priority">Prioridad</label>
                            <select id="priority" name="priority">
                                <option value="baja">Baja</option>
                                <option value="media" selected>Media</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Agregar Tarea</button>
                    <span class="success-message" id="successMessage"></span>
                </form>
            </section>

            <!-- Filtros y búsqueda -->
            <section class="filters-section">
                <h2>Mis Tareas</h2>
                <div class="filters">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="🔍 Buscar tareas..." 
                        class="search-box"
                    >
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="todas">Todas</button>
                        <button class="filter-btn" data-filter="pendientes">Pendientes</button>
                        <button class="filter-btn" data-filter="completadas">Completadas</button>
                    </div>
                </div>
                <div class="tasks-stats">
                    <span>Total: <strong id="totalTasks">0</strong></span>
                    <span>Completadas: <strong id="completedTasks">0</strong></span>
                    <span>Pendientes: <strong id="pendingTasks">0</strong></span>
                </div>
            </section>

            <!-- Lista de tareas -->
            <section class="tasks-section">
                <div id="tasksList" class="tasks-list">
                    <p class="empty-message">No hay tareas aún. ¡Crea una para comenzar!</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 CloudTasks - Etapa 1: Desarrollo Local | Ingeniería de Software ICESI</p>
        </footer>
    </div>

    <!-- Script -->
    <script src="js/app.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tu configuración -->
    <script src="js/config.js"></script>
    
    <!-- Tu app -->
    <script src="js/app.js"></script>
</body>
</html>
